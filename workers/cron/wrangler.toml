name = "called-cron"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Vercel Hobby only allows daily crons, so the schedule lives here instead.
# Each entry maps to one route on the app; see src/index.ts.
[triggers]
crons = [
  "*/5 * * * *",
  "*/15 * * * *",
  "0 21 * * *",
  "30 6 * * *",
  "45 21 * * *",
]

[vars]
APP_URL = "https://called-five.vercel.app"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true